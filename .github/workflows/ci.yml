name: CI

on:
  push:
    branches: [develop, 'feature/**']
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/core/core.slnx

      - name: Build
        run: dotnet build src/core/core.slnx -c Release --no-restore --nologo

      - name: Test
        run: dotnet test src/core/core.slnx -c Release --no-build --nologo --verbosity minimal

      - name: Build samples
        run: dotnet build samples/Samples.slnx -c Release --nologo

      - name: Pack
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet pack src/core/BrightstarDB.Core -c Release --no-build -o artifacts/
          dotnet pack src/core/BrightstarDB -c Release --no-build -o artifacts/
          dotnet pack src/core/BrightstarDB.CodeGeneration -c Release --no-build -o artifacts/
          dotnet pack src/core/BrightstarDB.CodeGeneration.Console -c Release --no-build -o artifacts/
          dotnet pack src/core/BrightstarDB.CodeGeneration.T4 -c Release --no-build -o artifacts/

      - name: Upload NuGet packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.nupkg
